version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: oin_nomina_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    networks:
      - oin_network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(\"http://127.0.0.1:4000/api/health\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    container_name: oin_nomina_frontend
    restart: unless-stopped
    ports:
      - "3006:80"
    networks:
      - oin_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  oin_network:
    external: true
    
